{% extends "base.html" %}

{% block title %}Reset Password - SkillExchange{% endblock %}

{% block content %}

<div class="auth-section">
    <div class="auth-container">

        <div class="auth-info">
            <h1>Create New Password</h1>
            <p>Choose a strong password for your SkillExchange account.</p>
        </div>

        <div class="auth-form">

            <h2>Reset Password</h2>

            <form method="POST">

                <label>New Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >

                <button type="submit">
                    Reset Password
                </button>

            </form>

        </div>

    </div>
</div>

{% endblock %}
