<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}SkillExchange{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav-container">

            <a href="{{ url_for('home') }}"
               class="logo">
                Skill<span>Exchange</span>
            </a>

            <nav class="nav-links">

                <a href="{{ url_for('home') }}">
                    Home
                </a>

                <a href="{{ url_for('skills') }}">
                    Skills
                </a>

                {% if session.get("user_id") %}

                    <a href="{{ url_for('dashboard') }}">
                        Dashboard
                    </a>

                    <a href="{{ url_for('profile') }}">
                        Profile
                    </a>

                    <a href="{{ url_for('logout') }}" class="logout-link">
                        Logout
                    </a>

                {% else %}

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>

                    <a href="{{ url_for('register') }}" class="nav-button">
                        Get Started
                    </a>

                {% endif %}

            </nav>
        </div>

    </header>


    <!-- PAGE CONTENT -->

    {% block content %}
    {% endblock %}


    <!-- FOOTER -->

    <footer>

        <div class="footer-container">

            <div class="footer-brand">

                <h3>
                    Skill<span>Exchange</span>
                </h3>

                <p>
                    Learn, teach and connect with people
                    through skill sharing.
                </p>

            </div>

        </div>

        <div class="footer-bottom">

            © 2026 SkillExchange. All rights reserved.

        </div>

    </footer>


    <!-- JavaScript -->

    <script src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
